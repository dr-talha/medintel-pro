<main id="main-content" class="error-page">

      <svg width="180" height="180" viewBox="0 0 180 180" fill="none">

        <circle cx="90" cy="90" r="86" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="8 6"/>
        <path d="M30 90h30l15-35 20 70 15-45 10 20h20" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="90" y="150" text-anchor="middle" fill="var(--text-muted)" font-size="13" font-family="Arial, sans-serif">404</text>
      </svg>
    </div>

    <h1 class="error-page__title">Page not found</h1>
    <p class="error-page__sub">The page you're looking for doesn't exist or may have moved. But all our medical tools are right below.</p>

    <!-- Search -->
    <form class="error-search" action="/drugs.html" role="search" style="margin:2rem 0;">

      <button type="submit" class="btn btn--primary">Search</button>
    </form>

    <!-- Quick links -->
    <div class="error-links">
      <a href="/" class="error-link-card">
        <svg width="24" height="24" viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect width="28" height="28" rx="6" fill="var(--accent)"/><path d="M14 6v16M6 14h16" stroke="var(--bg-primary)" stroke-width="2.5" stroke-linecap="round"/></svg>

        <span>Drug Lookup</span>
      </a>
      <a href="/calculators.html" class="error-link-card">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" stroke="var(--accent)" stroke-width="1.5"/><path d="M8 8h8M8 12h5M8 16h7" stroke="var(--accent)" stroke-width="1.3" stroke-linecap="round"/></svg>

        <span>First Aid</span>
